name: HigGym
options:
  bundleIdPrefix: com.leeo
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: QGAQ3AY3R3
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  LeeoKit:
    url: https://github.com/M1zz/LeeoKit.git
    majorVersion: 3.16.1

configFiles:
  Debug: Version.xcconfig
  Release: Version.xcconfig

targets:
  HigGym:
    type: application
    platform: iOS
    sources:
      - path: HigGymApp/Sources
      - path: HigGymApp/Resources
        buildPhase: resources
    dependencies:
      - package: LeeoKit
    info:
      path: HigGymApp/Info.plist
      properties:
        CFBundleDisplayName: 앱 디자인 실습
        CFBundleName: 앱 디자인 실습
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    # 익명 사용 통계·크래시 진단을 FeedbackHub(CloudKit)로 올리는 권한. 빼면 CKContainer 를 만드는 순간 앱이 죽는다.
    entitlements:
      path: HigGymApp/HigGym.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.Ysoup.FeedbackHub
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeo.higgym
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
