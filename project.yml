name: HigGym
options:
  bundleIdPrefix: com.leeo
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

configFiles:
  Debug: Version.xcconfig
  Release: Version.xcconfig

targets:
  HigGym:
    type: application
    platform: iOS
    sources:
      - path: HigGymApp/Sources
      - path: HigGymApp/Resources
        buildPhase: resources
    info:
      path: HigGymApp/Info.plist
      properties:
        CFBundleDisplayName: 앱 디자인 실습
        CFBundleName: 앱 디자인 실습
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeo.higgym
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
